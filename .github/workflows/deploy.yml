name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: public/models
          key: models-${{ hashFiles('src/config.js') }}
      - name: Download model files to self-host them
        # If this fails, the site is still built; browsers then download the model from huggingface.co.
        run: |
          if node scripts/fetch-models.mjs; then
            echo "VITE_SELF_HOST_MODELS=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Model download failed; the site will load the model from huggingface.co instead."
            rm -rf public/models
          fi
      - name: Work out the site path
        run: |
          REPO='${{ github.event.repository.name }}'
          case "$REPO" in *.github.io) echo "BASE_PATH=/" >> "$GITHUB_ENV" ;; *) echo "BASE_PATH=/$REPO/" >> "$GITHUB_ENV" ;; esac
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
